services:
  website:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      TELEGRAM_API_KEY: ${TELEGRAM_API_KEY:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-6056397902,5673533667,923586346}
      COOKIE_SECURE: 1
      TRUST_CADDY: 1
      METRICA_ID: ${METRICA_ID:-}
      GA4_ID: ${GA4_ID:-}
    volumes: ["site-data:/app/data", "site-uploads:/app/public/assets/uploads"]
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      options: {max-size: "10m", max-file: "3"}
  telegram-bot:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_KEY: ${TELEGRAM_API_KEY:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-6056397902,5673533667,923586346}
      SITE_API_URL: http://website:3001
      BOT_POLL_SECONDS: 5
    volumes: ["telegram-data:/app/state"]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      options: {max-size: "10m", max-file: "3"}
    depends_on:
      website: {condition: service_healthy}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on:
      website: {condition: service_healthy}
volumes:
  telegram-data:
  site-data:
  site-uploads:
  caddy-data:
  caddy-config:
